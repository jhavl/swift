[project]

name = "swift-sim"

description = "A Python/Javascript Robot Simulator and Visualiser"

version = "2.0.1"

authors = [
    { name = "Jesse Haviland", email = "j.haviland@qut.edu.au" },
    { name = "Peter Corke", email = "rvc@petercorke.com" },
]

dependencies = ["numpy>=2.0", "spatialgeometry>=1.4.0", "websockets"]

license = { file = "LICENSE" }

readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "python",
    "robotics",
    "robotics-toolbox",
    "kinematics",
    "dynamics",
    "motion-planning",
    "trajectory-generation",
    "jacobian",
    "hessian",
    "control",
    "simulation",
    "robot-manipulator",
    "mobile-robot",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


[project.urls]
homepage = "https://github.com/jhavl/swift"
documentation = "https://jhavl.github.io/swift/"
repository = "https://github.com/jhavl/swift"


[project.optional-dependencies]

dev = [
    "black",
    "swift-sim",
    "pytest",
    "pytest-cov",
    "flake8",
    "pyyaml",
]

docs = ["sphinx", "sphinx_rtd_theme", "sphinx-autorun", "sphinx-autodoc-typehints", "sphinx-copybutton"]

nb = ["ipython", "notebook"]

[build-system]

requires = ["setuptools", "numpy>=2.0.0"]

build-backend = "setuptools.build_meta"


[tool.setuptools]

package-dir = { "" = "src" }
packages = ["swift"]


[tool.pytest.ini_options]

# Swift's tests never involve roboticstoolbox: the dependency is strictly one
# way (RTB depends on swift), and tests/conftest.py blocks the import for the
# whole session. Robot-shaped tests use tests/fake_robot.py instead; the real
# Robot/swift pairing is tested by RTB's own CI.
#
# integration: needs Node and `npm ci` in src/swift/public (drives the real
# JS frontend code), which the main Python job doesn't set up -- excluded by
# default and run by the Integration workflow (integration.yml) with
# `pytest -m integration`.
markers = [
    "integration: needs Node and npm dependencies; run by the Integration workflow",
]
addopts = "-m 'not integration'"

# tests/test_lights.py imports fixtures from tests/test_protocol.py as
# `tests.test_protocol`, which needs the repo root on sys.path. That's
# implicit when running via `python -m pytest` (which prepends cwd) but
# not for a bare `pytest` invocation -- which is what CI's workflow uses,
# so every CI run has been failing at collection since this landed.
pythonpath = ["."]

[tool.black]

line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.github
    | _build
    | buck-out
    | build
    | dist
    | docs
  )/
)
'''


[tool.flake8]

max-line-length = 88
extend-ignore = 'E203'


[tool.cibuildwheel]

# Will cause the wheel to be installed with `pip install <wheel_file>[dev,collision]`
# test-extras = ["dev", "collision"]
# test-requires = "pytest"
# test-command = "pytest {project}/tests"

manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Build CPython
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]

# Disable building musllinux wheels on all platforms
skip = ["pp*", "*musllinux*"]


[tool.cibuildwheel.macos]

# Build `x86_64` and `arm64` wheels on an Intel runner.
# Note that the `arm64` wheel cannot be tested in this configuration.
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]

# On an Linux Intel runner with qemu installed, build Intel and ARM wheels
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]

# On an Windows Intel runner build wheels
archs = ["AMD64", "x86"]
