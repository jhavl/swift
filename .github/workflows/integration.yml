# End-to-end checks, on the operating systems users actually run swift on, of
# the paths where Python, the JS frontend and the OS meet. Most of tests/
# drains Swift's queues through a fake browser and runs on Linux only, which is
# how jhavl/swift#152 (Windows backslashes in mesh paths) shipped -- every test
# passed. These drive the real JS (under Node) against a real SwiftServer over
# a real socket: the /retrieve route (spatialgeometry -> JS retrieveUrl() ->
# server) and the JS asset hash check (JS integrity.js -> Python
# _check_js_assets). They are the tests marked `integration`.
#
# Deliberately RTB-free: swift needs only numpy, spatialgeometry and
# websockets, and nothing here should pull in roboticstoolbox.

name: Integration

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main, future]

jobs:
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # See both platforms' results even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        working-directory: src/swift/public
        run: npm ci

      - name: Install spatialgeometry from its own main branch
        # The point is the handoff with what spatialgeometry currently
        # serializes (Mesh.to_dict()), so test against its main, not the
        # last PyPI release.
        run: pip install "git+https://github.com/jhavl/spatialgeometry.git@main"

      - name: Install swift-sim and pytest
        run: pip install -e . pytest

      - name: Run integration tests
        # Everything marked `integration`, so a new integration test is picked
        # up without touching this file. Collecting all of tests/ needs
        # nothing beyond what's installed above (the suite is RTB-free).
        run: pytest -m integration tests/ -v -rs
