# Confirms the vendored browser assets in src/swift/public/js/vendor/ still
# match what `npm run build:vendor` produces from the pinned dependencies
# in src/swift/public/package.json -- catches accidental edits/deletions of
# the vendored copies, and (via Dependabot bumping package.json) surfaces
# version drift before it goes unnoticed for years the way it did before.

name: Vendor assets check

on:
  push:
    branches: [main, future]
    paths: ["src/swift/public/**"]
  pull_request:
    branches: [main, future]
    paths: ["src/swift/public/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/swift/public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm test
      - run: npm run build:vendor

      - name: Fail if the build produced a different vendored tree
        run: |
          git diff --exit-code -- js/vendor/ || {
            echo "::error::js/vendor/ doesn't match what package.json's pinned versions produce. Run 'npm run build:vendor' in src/swift/public/ and commit the result.";
            exit 1;
          }
