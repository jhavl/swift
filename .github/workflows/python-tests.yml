# Runs Swift's Python test suite (tests/) and the JS unit tests
# (src/swift/public/js/*.test.js) on every push/PR -- previously nothing
# in CI ever ran either; only src/swift/public/**'s vendored-asset check
# existed (see vendor-check.yml).

name: CI

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main, future]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install swift-sim and test tools
        # Deliberately no roboticstoolbox: the dependency is strictly one way
        # (RTB depends on swift), swift's tests use tests/fake_robot.py, and
        # tests/conftest.py blocks the import. The real Robot/swift pairing
        # is tested by RTB's own CI. spatialgeometry comes from PyPI via
        # swift's own requirement (>=1.4.0, which has Polyline -- the old
        # install-from-main workaround for the unreleased rename is gone).
        run: pip install -e . pytest pytest-cov black flake8 pyyaml

      - name: Run Python tests
        run: pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        # Only ui.js/comms.js/screenshot.js's tests existed when this step
        # was never added -- none of them import anything from
        # node_modules, so this gap was invisible until shapes.test.js
        # (which imports shapes.js, which imports three) needed it.
        working-directory: src/swift/public
        run: npm ci

      - name: Run JS unit tests
        run: node --test src/swift/public/js/*.test.js
