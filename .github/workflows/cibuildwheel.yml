# Builds every wheel plus the sdist. Only a published release goes on to
# upload to PyPI (see upload_pypi's `if:`); pull requests that touch the build
# configuration and manual runs are dry runs, so a broken wheel build (e.g. a
# new Python version) is caught before release day, not during it.

name: Build all Wheels

on:
  release:
    types: [created]
  pull_request:
    paths:
      - pyproject.toml
      - setup.py
      - .github/workflows/cibuildwheel.yml
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD_VERBOSITY: 1
          # Only build CPython 3.10-3.14; skip PyPy and free-threaded builds.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *musllinux*"
          # Only build for this runner's native arch (no QEMU cross-compilation).
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    # Publish only for a real release -- a manual run or a PR is a dry run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
